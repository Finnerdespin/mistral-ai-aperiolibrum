<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations - AperioLibrum</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Aperio<span>Librum</span></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="books.html">Books</a></li>
                    <li><a href="loans.html">My Loans</a></li>
                    <li><a href="reservations.html" class="active">Reservations</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3>My Reservations</h3>
                <button class="btn btn-primary" id="new-reservation-btn">New Reservation</button>
            </div>
            
            <div id="reservations-alert" class="alert" style="display: none;"></div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>Book</th>
                        <th>Author</th>
                        <th>Reservation Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="reservations-table">
                    <tr>
                        <td colspan="5" style="text-align: center;">
                            <div class="spinner"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- New Reservation Modal -->
    <div id="reservation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Reservation</h2>
                <span class="close" id="close-reservation-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="reservation-form-alert" class="alert" style="display: none;"></div>
                <form id="reservation-form">
                    <div class="form-group">
                        <label for="reservation-book">Book *</label>
                        <select id="reservation-book" required>
                            <option value="">Select a book</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-reservation-btn">Cancel</button>
                <button type="button" class="btn btn-primary" id="create-reservation-btn">Create Reservation</button>
            </div>
        </div>
    </div>

    <!-- Cancel Reservation Modal -->
    <div id="cancel-reservation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Cancel Reservation</h2>
                <span class="close" id="close-cancel-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p id="cancel-confirmation-text"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="cancel-no-btn">No, Keep It</button>
                <button type="button" class="btn btn-danger" id="confirm-cancel-btn">Yes, Cancel</button>
            </div>
        </div>
    </div>

    <script src="../static/app.js"></script>
</body>
</html>
