<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AperioLibrum - Library Management System</title>
    <link rel="stylesheet" href="{{ url_for("static", filename="style.css") }}">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Aperio<span>Librum</span></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="/" class="active">Home</a></li>
                    <li><a href="/books">Books</a></li>
                    <li><a href="/loans">My Loans</a></li>
                    <li><a href="/reservations">Reservations</a></li>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/login">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="dashboard">
            <div class="stat-card">
                <h3>Total Books</h3>
                <div class="stat-value" id="total-books">-</div>
            </div>
            <div class="stat-card">
                <h3>Available Books</h3>
                <div class="stat-value" id="available-books">-</div>
            </div>
            <div class="stat-card">
                <h3>Active Loans</h3>
                <div class="stat-value" id="active-loans">-</div>
            </div>
            <div class="stat-card">
                <h3>Pending Reservations</h3>
                <div class="stat-value" id="pending-reservations">-</div>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <h3>Featured Books</h3>
                <a href="/books" class="btn btn-secondary">View All</a>
            </div>
            <div class="book-grid" id="featured-books">
                <div class="spinner"></div>
            </div>
        </section>

        <section class="card">
            <div class="card-header">
                <h3>Quick Actions</h3>
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                    <a href="/books" class="btn btn-primary">Browse Books</a>
                    <a href="/loans" class="btn btn-info">My Loans</a>
                    <a href="/reservations" class="btn btn-warning">My Reservations</a>
                    <a href="/profile" class="btn btn-secondary">My Profile</a>
                </div>
            </div>
        </section>
    </div>

    <script src="{{ url_for("static", filename="app_flask.js") }}"></script>
</body>
</html>
